
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>M-PESA Payment System</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f2f5f3;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .payment-box {
            background: white;
            padding: 30px;
            width: 100%;
            max-width: 380px;
            border-radius: 12px;
            box-shadow: 0 4px 15px #0002;
        }

        h2 {
            text-align: center;
            color: #168344;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            font-size: 14px;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
            color: #333;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #168344;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 25px;
            background: #168344;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }

        button:hover {
            background: #106333;
        }

        button:disabled {
            background: #999;
            cursor: not-allowed;
        }

        #message {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            line-height: 1.6;
            overflow-wrap: anywhere;
        }

        .success {
            color: #168344;
            font-weight: bold;
        }

        .waiting {
            color: #b7791f;
        }

        .error {
            color: red;
        }

        .footer {
            text-align: center;
            font-size: 12px;
            color: #888;
            margin-top: 20px;
        }

        .mpesa-logo {
            text-align: center;
            font-size: 25px;
            font-weight: bold;
            color: #168344;
        }
    </style>
</head>

<body>

<div class="payment-box">

    <div class="mpesa-logo">M-PESA</div>

    <h2>Payment System</h2>

    <p class="subtitle">
        Enter your details to initiate payment
    </p>

    <form id="paymentForm">

        <label for="phone">Phone Number</label>

        <input
            type="tel"
            id="phone"
            placeholder="07XXXXXXXX"
            maxlength="10"
            required
        >

        <label for="amount">Amount (KSh)</label>

        <input
            type="number"
            id="amount"
            placeholder="Enter amount"
            min="1"
            step="1"
            required
        >

        <button type="submit" id="paymentButton">
            Prompt Payment
        </button>

    </form>

    <p id="message"></p>

    <div class="footer">
        Secure M-PESA Payment | Powered by Supabase
    </div>

</div>

<script>

// ===================================
// 1. SUPABASE CONNECTION
// ===================================

const SUPABASE_URL =
"https://hisoknujnrdvgbgwjwdm.supabase.co";

const SUPABASE_KEY =
"sb_publishable_qEktVTgKrP5sIzf-HeTMyg_734tagyd";

const supabaseClient = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


// ===================================
// 2. PAYMENT FUNCTION
// ===================================

let paymentInProgress = false;

document.getElementById("paymentForm")
.addEventListener("submit", async function(event) {

    event.preventDefault();

    if (paymentInProgress) return;

    const phone =
        document.getElementById("phone").value.trim();

    const amount =
        Number(document.getElementById("amount").value);

    const message =
        document.getElementById("message");

    const button =
        document.getElementById("paymentButton");


    // Validate phone number

    if (!/^(07|01)\d{8}$/.test(phone)) {

        message.className = "error";
        message.innerText =
            "Enter a valid Kenyan phone number.";

        return;
    }


    // Validate amount

    if (!Number.isSafeInteger(amount) || amount <= 0) {

        message.className = "error";
        message.innerText =
            "Enter a valid amount.";

        return;
    }


    paymentInProgress = true;

    button.disabled = true;
    button.innerText = "Sending Prompt...";

    message.className = "waiting";
    message.innerText =
        "Connecting to M-PESA. Please wait...";


    try {

        // Initiate actual STK Push

        const { data, error } =
            await supabaseClient.functions.invoke(
                "mpesa-push",
                {
                    body: {
                        phone: phone,
                        amount: amount
                    }
                }
            );


        if (error) throw error;

        if (!data || !data.success) {
            throw new Error(
                data?.message || "Unable to send payment prompt."
            );
        }


        // STK Push successfully initiated

        message.className = "waiting";

        message.innerHTML = `
            <strong>M-PESA prompt sent!</strong><br>
            Check your phone ${phone}.<br>
            Enter your M-PESA PIN to complete payment.
            <br><br>
            Waiting for payment confirmation...
        `;

        button.innerText = "Waiting for Payment";


        // Wait for callback confirmation

        const checkoutID = data.checkout_request_id;

        if (!checkoutID) {
            throw new Error(
                "Missing payment reference from Daraja."
            );
        }

        let completed = false;

        // Check database for callback result
        // Every 3 seconds, for up to 2 minutes

        for (let i = 0; i < 40; i++) {

            await new Promise(resolve =>
                setTimeout(resolve, 3000)
            );

            const { data: payment, error: checkError } =
                await supabaseClient
                    .from("payments")
                    .select("status, mpesa_receipt_number")
                    .eq("checkout_request_id", checkoutID)
                    .maybeSingle();

            if (checkError) {
                throw checkError;
            }

            if (!payment) continue;

            if (payment.status === "Paid") {

                message.className = "success";

                message.innerHTML = `
                    <strong>✓ PAYMENT SUCCESSFUL!</strong><br>
                    Amount: KSh ${amount.toLocaleString()}<br>
                    Receipt: ${payment.mpesa_receipt_number}
                `;

                completed = true;
                break;
            }

            if (payment.status === "Failed") {

                message.className = "error";

                message.innerHTML =
                    "Payment was unsuccessful. Please try again.";

                completed = true;
                break;
            }
        }

        if (!completed) {

            message.className = "waiting";

            message.innerHTML =
                "Payment confirmation is taking longer than expected. " +
                "Please check your M-PESA messages before trying again.";

        }

    } catch (error) {

        console.error("Payment error:", error);

        message.className = "error";

        message.innerText =
            error.message || "Payment request failed.";

    } finally {

        paymentInProgress = false;

        button.disabled = false;
        button.innerText = "Prompt Payment";

    }

});

</script>

</body>
</html>
