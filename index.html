
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>M-PESA Payment System</title>

    <!-- Supabase Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f2f5f3;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 15px;
        }

        .payment-box {
            background: white;
            padding: 25px;
            width: 100%;
            max-width: 500px;
            border-radius: 12px;
            box-shadow: 0 4px 15px #0002;
        }

        .mpesa-logo {
            text-align: center;
            font-size: 30px;
            font-weight: bold;
            color: #168344;
            margin-bottom: 10px;
        }

        h2 {
            text-align: center;
            color: #168344;
            margin-bottom: 10px;
        }

        h3 {
            color: #168344;
        }

        .subtitle {
            text-align: center;
            color: #777;
            font-size: 14px;
            margin-bottom: 25px;
        }

        /* NAVIGATION BUTTONS */

        .navigation {
            display: flex;
            flex-direction: row;
            gap: 10px;
            width: 100%;
            margin-bottom: 25px;
        }

        button {
            padding: 13px;
            background: #168344;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
        }

        button:hover {
            background: #106333;
        }

        button:disabled {
            background: #999;
            cursor: not-allowed;
        }

        .navigation button {
            flex: 1;
            min-width: 0;
        }

        .admin-button {
            background: #263b30;
        }

        .admin-button:hover {
            background: #14251b;
        }

        /* INPUT FIELDS */

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
            color: #333;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #168344;
        }

        .main-button {
            width: 100%;
            margin-top: 25px;
        }

        /* MESSAGES */

        #message,
        #adminMessage,
        #recordsMessage {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            line-height: 1.6;
            overflow-wrap: anywhere;
        }

        .success {
            color: #168344;
            font-weight: bold;
        }

        .waiting {
            color: #b7791f;
        }

        .error {
            color: red;
        }

        /* HIDE AND SHOW SECTIONS */

        .hidden {
            display: none !important;
        }

        /* ADMIN DASHBOARD */

        .dashboard {
            margin-top: 25px;
        }

        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .logout-button {
            background: #b42318;
            width: auto;
            margin: 0;
        }

        .logout-button:hover {
            background: #8e1912;
        }

        .table-container {
            width: 100%;
            overflow-x: auto;
            margin-top: 15px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        th, td {
            padding: 10px;
            border: 1px solid #ddd;
            text-align: left;
            white-space: nowrap;
        }

        th {
            background: #168344;
            color: white;
        }

        .paid {
            color: green;
            font-weight: bold;
        }

        .failed {
            color: red;
            font-weight: bold;
        }

        /* FOOTER */

        .footer {
            text-align: center;
            font-size: 12px;
            color: #888;
            margin-top: 25px;
        }

        /* MOBILE RESPONSIVENESS */

        @media screen and (max-width: 400px) {

            .payment-box {
                padding: 18px 12px;
            }

            .navigation {
                gap: 6px;
            }

            .navigation button {
                font-size: 11px;
                padding: 12px 4px;
            }

            .mpesa-logo {
                font-size: 26px;
            }

            table {
                font-size: 12px;
            }
        }

    </style>
</head>

<body>

<div class="payment-box">

    <div class="mpesa-logo">M-PESA</div>

    <h2>Payment System</h2>

    <p class="subtitle">
        Welcome to our secure payment platform
    </p>


    <!-- NAVIGATION -->

    <div class="navigation">

        <button type="button" id="showPaymentBtn">
            Prompt Payment
        </button>

        <button type="button"
                class="admin-button"
                id="showAdminBtn">
            Payment Done (Admin)
        </button>

    </div>


    <!-- CUSTOMER PAYMENT SECTION -->

    <section id="paymentSection">

        <h3>Make Payment</h3>

        <form id="paymentForm">

            <label for="phone">
                Phone Number
            </label>

            <input
                type="tel"
                id="phone"
                placeholder="07XXXXXXXX"
                maxlength="10"
                pattern="(07|01)[0-9]{8}"
                required
            >

            <label for="amount">
                Amount (KSh)
            </label>

            <input
                type="number"
                id="amount"
                placeholder="Enter amount"
                min="1"
                max="150000"
                step="1"
                required
            >

            <button
                type="submit"
                id="paymentButton"
                class="main-button">

                Prompt Payment

            </button>

        </form>

        <p id="message" aria-live="polite"></p>

    </section>


    <!-- ADMIN LOGIN SECTION -->

    <section id="adminSection" class="hidden">

        <h3>Administrator Login</h3>

        <p class="subtitle">
            Only authorized administrators can access payment records.
        </p>

        <form id="adminLoginForm">

            <label for="adminEmail">
                Admin Email
            </label>

            <input
                type="email"
                id="adminEmail"
                placeholder="Enter admin email"
                autocomplete="username"
                required
            >

            <label for="adminPassword">
                Password
            </label>

            <input
                type="password"
                id="adminPassword"
                placeholder="Enter admin password"
                autocomplete="current-password"
                required
            >

            <button
                type="submit"
                id="loginButton"
                class="main-button">

                Login to Dashboard

            </button>

        </form>

        <p id="adminMessage" aria-live="polite"></p>

    </section>


    <!-- ADMIN DASHBOARD -->

    <section id="dashboardSection" class="hidden dashboard">

        <div class="dashboard-header">

            <h3>Payment Records</h3>

            <button
                type="button"
                class="logout-button"
                id="logoutButton">

                Logout

            </button>

        </div>

        <p id="adminWelcome"></p>

        <button
            type="button"
            id="refreshButton">

            Refresh Payments

        </button>

        <p id="recordsMessage"></p>

        <div class="table-container">

            <table>

                <thead>

                    <tr>
                        <th>Phone</th>
                        <th>Amount</th>
                        <th>Status</th>
                        <th>M-PESA Receipt</th>
                        <th>Date</th>
                    </tr>

                </thead>

                <tbody id="paymentsTable">

                </tbody>

            </table>

        </div>

    </section>


    <!-- FOOTER -->

    <div class="footer">
        Secure M-PESA Payment | Powered by Supabase
    </div>

</div>


<!-- JAVASCRIPT -->

<script src="style.js"></script>

</body>
</html>
