
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>M-PESA Payment System</title>

    <!-- Supabase Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- External CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="payment-box">

    <div class="mpesa-logo">M-PESA</div>

    <h2>Payment System</h2>

    <p class="subtitle">
        Welcome to our secure payment platform
    </p>

    <!-- NAVIGATION -->
    <div class="navigation">

        <button type="button" id="showPaymentBtn">
            Prompt Payment
        </button>

        <button type="button"
                class="admin-button"
                id="showAdminBtn">
            Payment Done (Admin)
        </button>

    </div>

    <!-- CUSTOMER PAYMENT -->
    <section id="paymentSection">

        <h3>Make Payment</h3>

        <form id="paymentForm">

            <label for="phone">Phone Number</label>

            <input
                type="tel"
                id="phone"
                placeholder="07XXXXXXXX"
                maxlength="10"
                pattern="(07|01)[0-9]{8}"
                required
            >

            <label for="amount">Amount (KSh)</label>

            <input
                type="number"
                id="amount"
                placeholder="Enter amount"
                min="1"
                max="150000"
                step="1"
                required
            >

            <button
                type="submit"
                id="paymentButton"
                class="main-button">
                Prompt Payment
            </button>

        </form>

        <p id="message" aria-live="polite"></p>

    </section>

    <!-- ADMIN LOGIN -->
    <section id="adminSection" class="hidden">

        <h3>Administrator Login</h3>

        <p class="subtitle">
            Only authorized administrators can access payment records.
        </p>

        <form id="adminLoginForm">

            <label for="adminEmail">Admin Email</label>

            <input
                type="email"
                id="adminEmail"
                placeholder="Enter admin email"
                autocomplete="username"
                required
            >

            <label for="adminPassword">Password</label>

            <input
                type="password"
                id="adminPassword"
                placeholder="Enter admin password"
                autocomplete="current-password"
                required
            >

            <button
                type="submit"
                id="loginButton"
                class="main-button">
                Login to Dashboard
            </button>

        </form>

        <p id="adminMessage" aria-live="polite"></p>

    </section>

    <!-- ADMIN DASHBOARD -->
    <section id="dashboardSection" class="hidden dashboard">

        <div class="dashboard-header">

            <h3>Payment Records</h3>

            <button
                type="button"
                class="logout-button"
                id="logoutButton">
                Logout
            </button>

        </div>

        <p id="adminWelcome"></p>

        <button type="button" id="refreshButton">
            Refresh Payments
        </button>

        <p id="recordsMessage"></p>

        <div class="table-container">

            <table>

                <thead>
                    <tr>
                        <th>Phone</th>
                        <th>Amount</th>
                        <th>Status</th>
                        <th>M-PESA Receipt</th>
                        <th>Date</th>
                    </tr>
                </thead>

                <tbody id="paymentsTable"></tbody>

            </table>

        </div>

    </section>

    <!-- FOOTER -->
    <div class="footer">
        Secure M-PESA Payment | Powered by LAXAMINIZ COLLECTION
    </div>

</div>

<!-- External JavaScript -->
<script src="style.js"></script>

</body>
</html>
